<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>job search results</title>
    <link rel="icon" type="image/x-icon" href="icon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #FFFFF0; /* Ivory */
        }
        
        /* Smooth transitions for responsiveness */
        .logo-container {
            transition: all 0.3s ease-in-out;
        }
        
        /* Mobile red background with 100% side padding */
        @media (max-width: 767px) {
            .logo-red-bg {
                background-color: #ef4444;
                margin-left: calc(-50vw + 50%);
                margin-right: calc(-50vw + 50%);
                width: 100vw;
                padding-top: 0;
                padding-bottom: 0;
                display: flex;
                justify-content: center;
                align-items: center;
            }
        }
    </style>
</head>
<body class="min-h-screen">

    <!-- Header / Logo Area -->
    <header class="p-4 md:p-8 flex justify-center md:block">
        <div class="logo-container w-full md:w-auto">
            <!-- Red background container for mobile with 100% side padding -->
            <div class="logo-red-bg flex justify-center md:justify-start items-center">
                <!-- Logo Image -->
                <img src="logo.png" alt="Logo" class="h-16 md:w-48 md:h-16 object-contain">
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="px-4 md:px-8 py-4">
        <!-- Responsive Heading: Bold, Black, and Italic -->
        <h2 class="text-xl sm:text-2xl md:text-3xl font-bold italic text-black">
            results for <span id="keyword">keyword</span> jobs in <span id="location">location</span>
        </h2>
    </main>

</body>
</html>
